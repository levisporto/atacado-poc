<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f4eee5">
<title>Painel do Atacado</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Baloo+2:wght@600;700&display=swap">
<link rel="stylesheet" href="styles.css">
<style>
  /* Painel: mesma paleta da loja, layout de mesa (lista larga), funciona no celular */
  body { padding-bottom: 40px; }
  .adm { max-width: 1120px; margin: 0 auto; padding: 0 16px; }
  .adm-head { display: flex; align-items: center; gap: 12px; padding: 18px 0 8px; }
  .adm-head h1 { font-family: var(--f-display); font-size: 1.5rem; margin: 0; flex: 1; line-height: 1.1; }
  .adm-head .who { color: var(--muted); font-size: .88rem; }
  .adm-head .ghost { width: auto; height: 40px; }
  .adm-tabs { display: flex; gap: 4px; padding: 4px; background: var(--bg-2); border-radius: 16px; margin: 8px 0 16px; overflow-x: auto; }
  .adm-tabs button { flex: 1; border: 0; background: none; border-radius: 12px; height: 44px; padding: 0 14px; font-weight: 600; color: var(--muted); white-space: nowrap; }
  .adm-tabs button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
  .badge { display: inline-block; min-width: 20px; padding: 0 6px; margin-left: 6px; border-radius: 999px; background: var(--accent); color: #fff; font-size: .72rem; line-height: 20px; text-align: center; }
  .badge:empty { display: none; }
  .tools { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .tools input, .tools select { height: 42px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); padding: 0 12px; }
  .tools input { flex: 1; min-width: 180px; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chips button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; height: 36px; padding: 0 14px; font-weight: 600; font-size: .86rem; color: var(--ink-2); }
  .chips button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--on-ink); }
  .list { display: grid; gap: 10px; }
  .row { background: var(--surface); border-radius: 18px; box-shadow: var(--shadow); padding: 14px 16px; display: grid; gap: 8px; }
  .row-top { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
  .row-top b { font-size: 1rem; }
  .row-top .right { margin-left: auto; font-weight: 700; }
  .meta { display: flex; flex-wrap: wrap; gap: 4px 14px; color: var(--muted); font-size: .86rem; }
  .meta a { color: var(--brand); font-weight: 600; text-decoration: none; }
  .acts { display: flex; flex-wrap: wrap; gap: 8px; }
  .acts button { height: 38px; border-radius: 12px; border: 0; padding: 0 14px; font-weight: 600; background: var(--bg); }
  .acts .ok { background: var(--brand); color: var(--on-brand); }
  .acts .bad { background: var(--danger-soft); color: var(--danger); }
  .pill { display: inline-block; border-radius: 999px; padding: 1px 10px; font-size: .76rem; font-weight: 700; background: var(--bg-2); color: var(--ink-2); }
  .pill.pending, .pill.novo { background: var(--warn-soft); color: var(--warn); }
  .pill.approved, .pill.faturado { background: var(--ok-soft); color: var(--ok); }
  .pill.rejected, .pill.blocked, .pill.cancelado, .pill.fail { background: var(--danger-soft); color: var(--danger); }
  .pill.separando { background: #e3ecf8; color: #2a5590; }
  .row.click { cursor: pointer; transition: transform .15s var(--ease-out); }
  .row.click:hover { transform: translateY(-1px); }
  .empty { text-align: center; color: var(--muted); padding: 40px 16px; background: var(--surface); border-radius: 18px; }
  .login { max-width: 380px; margin: 12vh auto 0; display: grid; gap: 14px; }
  .login h1 { font-family: var(--f-display); text-align: center; margin: 0; }
  dialog { border: 0; border-radius: var(--r-card); padding: 0; width: min(720px, calc(100% - 24px)); max-height: calc(100% - 48px); box-shadow: var(--shadow-lg); background: var(--surface); color: var(--ink); }
  dialog::backdrop { background: rgba(31, 27, 23, .45); }
  .dlg { padding: 20px; display: grid; gap: 14px; }
  .dlg h2 { margin: 0; font-family: var(--f-display); font-size: 1.4rem; line-height: 1.15; }
  .dlg .x { position: absolute; right: 12px; top: 12px; width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--bg); font-size: 1.3rem; }
  .grade { width: 100%; border-collapse: collapse; font-size: .9rem; }
  .grade td, .grade th { text-align: left; padding: 8px 6px; border-top: 1px solid var(--line); vertical-align: top; }
  .grade th { font-size: .78rem; color: var(--muted); font-weight: 600; border-top: 0; }
  .grade td:last-child, .grade th:last-child { text-align: right; white-space: nowrap; }
  .grade .ref { color: var(--muted); font-size: .8rem; }
  .totline { display: flex; justify-content: space-between; font-weight: 700; font-size: 1.05rem; }
  .notes { background: var(--warn-soft); border-radius: 14px; padding: 10px 14px; font-size: .9rem; white-space: pre-wrap; }
  .status-pick { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .dlg-acts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .dlg-acts .primary { height: 50px; }
  @media (max-width: 520px) { .dlg-acts { grid-template-columns: 1fr; } }
  .pw { font-family: ui-monospace, Consolas, monospace; font-size: 1.6rem; letter-spacing: .12em; text-align: center; background: var(--bg); border-radius: 14px; padding: 12px; user-select: all; }
</style>
</head>
<body>
<main class="adm" id="app"><p class="note" style="padding:40px 0">Carregando…</p></main>
<dialog id="dlg"></dialog>
<div class="toast" id="toast" role="status" hidden></div>
<script src="admin.js"></script>
</body>
</html>
